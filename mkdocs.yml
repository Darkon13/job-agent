strict: true
site_name: Job Agent
site_description: Локальный сервис автоматизации поиска работы
site_url: https://darkon13.github.io/job-agent/
repo_url: https://github.com/Darkon13/job-agent
repo_name: Darkon13/job-agent
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  language: ru
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

nav:
  - Главная: index.md
  - Начало работы:
      - Quickstart: quickstart.md
      - Возможности: features.md
      - Runbook: runbook.md
  - Справочник:
      - CLI и фасад: cli.md
      - Конфигурация:
          - Обзор: reference/configuration.md
          - database: reference/configuration/database.md
          - server: reference/configuration/server.md
          - adapters: reference/configuration/adapters.md
          - models: reference/configuration/models.md
          - profiles: reference/configuration/profiles.md
          - applications: reference/configuration/applications.md
          - tailoring: reference/configuration/tailoring.md
          - conversations: reference/configuration/conversations.md
          - searches: reference/configuration/searches.md
          - jobs: reference/configuration/jobs.md
          - resources: reference/configuration/resources.md
          - employer_groups: reference/configuration/employer-groups.md
          - answer_sets: reference/configuration/answers.md
          - include: reference/configuration/includes.md
      - Письма и пулы: reference/messages.md
      - Шпаргалки и рецепты: reference/recipes.md
  - Профиль и состояние:
      - Desired state: profile-desired-state-and-routing.md
      - Bootstrap: profile-bootstrap.md
      - Tailoring резюме: application-resume-tailoring.md
      - Очистка откликов: application-cleanup.md
  - API и интеграции:
      - Conversation API: conversation-api.md
      - Browser RPC: browser-rpc.md
      - Dashboard runtime: dashboard-runtime.md
  - HeadHunter:
      - API-контракты: hh-api-contracts.md
      - Auth: hh-auth-flow.md
      - Поиск: hh-browser-search.md
      - Browser-операции: hh-browser-operations.md
      - Чаты: hh-chat-contract.md
      - Резюме: hh-resume-contract.md
      - Референс-инструмент: hh-applicant-tool-reference.md
  - Развитие:
      - Как писать адаптеры: writing-adapters.md
      - Roadmap: roadmap-v1.md
      - Релизы: releasing.md
      - Changelog: changelog.md
      - Model fallback: next-answer-model-fallback.md
      - Auth control plane: next-auth-control-plane.md
      - Cover letter routing: next-cover-letter-routing.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

extra_css:
  - assets/extra.css
