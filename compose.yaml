name: job-agent

x-runtime: &runtime
  image: ${JOB_AGENT_IMAGE:-job-agent:1.0.0}

x-runtime-volumes: &runtime-volumes
  - ${JOB_AGENT_CONFIG_DIR:-./deploy}:/config:ro
  - ${JOB_AGENT_DATA_DIR:-./data}:/data

services:
  job-agent:
    <<: *runtime
    build:
      context: .
      target: runtime
      args:
        VERSION: ${JOB_AGENT_VERSION:-1.0.0}
        COMMIT: ${JOB_AGENT_COMMIT:-unknown}
        BUILD_TIME: ${JOB_AGENT_BUILD_TIME:-unknown}
        MODIFIED: ${JOB_AGENT_MODIFIED:-unknown}
    command: ["/usr/local/bin/job-agent", "-migrate-up", "/config/${JOB_AGENT_CONFIG_NAME:-config.example.json}"]
    environment:
      JOB_AGENT_SERVER_LISTEN: 0.0.0.0:8080
      JOB_AGENT_SERVER_EXPOSURE: private
      # Set and reference via server.api_token_env to protect the private
      # container network endpoint with a bearer token.
      JOB_AGENT_API_TOKEN: ${JOB_AGENT_API_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BROWSER_WORKER_URL: ${BROWSER_WORKER_URL:-http://browser-worker:8088}
      BROWSER_WORKER_TOKEN: ${BROWSER_WORKER_TOKEN:-}
    user: "${JOB_AGENT_UID:-1000}:${JOB_AGENT_GID:-100}"
    volumes: *runtime-volumes
    expose:
      - "8080"
    restart: unless-stopped

  # Opt-in Playwright service (compose profile "browser"). The backend only
  # uses it for browser-only operations; until then the default profile stays
  # backend-only.
  browser-worker:
    profiles: ["browser"]
    build:
      context: ./browser-worker
    environment:
      # The worker refuses to start with an empty token, so the default
      # backend-only profile stays safe while `--profile browser` needs the
      # variable explicitly. Generate it once with scripts/init-env.sh.
      BROWSER_WORKER_TOKEN: ${BROWSER_WORKER_TOKEN:-}
      BROWSER_WORKER_HOST: 0.0.0.0
      BROWSER_WORKER_DATA_DIR: /data/browser-profiles
      BROWSER_WORKER_HEADLESS: ${BROWSER_WORKER_HEADLESS:-1}
    user: "${JOB_AGENT_UID:-1000}:${JOB_AGENT_GID:-100}"
    volumes:
      - ${JOB_AGENT_DATA_DIR:-./data}:/data
    expose:
      - "8088"
    restart: unless-stopped

  dashboard:
    <<: *runtime
    command: ["/usr/local/bin/job-agent-dashboard"]
    environment:
      JOB_AGENT_DASHBOARD_LISTEN: 0.0.0.0:8081
      JOB_AGENT_API_URL: http://job-agent:8080
      # Forwarded to the backend as Authorization: Bearer <token>. Keep the
      # token in the dashboard process environment, never in the browser.
      JOB_AGENT_API_TOKEN: ${JOB_AGENT_API_TOKEN:-}
    depends_on:
      job-agent:
        condition: service_started
    ports:
      - "${JOB_AGENT_DASHBOARD_BIND_IP:-127.0.0.1}:${JOB_AGENT_DASHBOARD_PORT:-8081}:8081"
    restart: unless-stopped
